[package]
name = "stipple"
version = "1.0.0"
description = "Turn a photo into a text-art wallpaper for Omarchy, with the Typist engine"
authors = ["kivan"]
license = "MIT"
edition = "2024"
rust-version = "1.95"

[lib]
name = "stipple_lib"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.1", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.2", features = [] }
tauri-runtime-wry = "3.0.0-alpha.2"
tauri-plugin-dialog = "3.0.0-alpha.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
png = "0.18.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
